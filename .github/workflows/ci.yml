name: CI

# Validate every PR the same way the deploy validates main: regenerate the codegen'd
# artifacts, verify the committed bundle is in sync with source, typecheck all three
# tsconfigs, and run the golden tests. This runs `on: pull_request`, so the results
# appear as CHECKS on the PR — previously the only workflow was deploy.yml (push to
# main), which runs after merge and so can't gate a PR.
#
# FORK-SAFE BY DESIGN: every step here is offline and needs NO secrets, so a pull
# request from a contributor's fork gets the same green-or-red signal a maintainer's
# branch does. Do not add a step that requires a token — put it in deploy.yml instead.
#
# TWO JOBS, AND THE SPLIT IS THE POINT. `check` is pure Node: it needs no browser and
# reports in about two minutes. `ui` needs Chromium and everything that comes with it.
# They used to be one job, so a prettier failure or a bad migration was only reported
# after the browser install had finished, which on a bad mirror day was ten minutes
# after the push: the cheapest signal to produce was the slowest to arrive. Splitting
# also means a browser-infra flake fails a job that is visibly about browsers rather
# than failing everything.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Every step here is local work with no network beyond the package install, and the
    # whole job lands in about two minutes. Without a timeout a step that hangs runs
    # until GitHub's 6-hour default, holding a runner and showing the pull request a
    # check that is neither passing nor failing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler.jsonc is generated and gitignored (it holds one deployment's
      # identity). The default profile writes placeholder Cloudflare resource ids,
      # which is exactly right here: the migration check below runs against
      # Miniflare and never contacts Cloudflare, so CI needs no credentials.
      - run: pnpm setup:config

      # Regenerate the codegen'd artifacts from source (app/ and brain-template/).
      - run: pnpm gen:templates
      - run: pnpm gen:app

      # The committed generated files must match a fresh regen — catches a PR that
      # edited app/ or brain-template/ but forgot to run `pnpm gen:app` / `gen:templates`.
      - name: Generated artifacts in sync with source
        run: |
          git diff --exit-code -- \
            src/lib/app-bundle.generated.ts \
            src/lib/brain-template.generated.ts \
          || { echo "::error::Generated files are stale — run 'pnpm gen:app' and 'pnpm gen:templates' and commit the result."; exit 1; }

      # Gate on a clean typecheck across all three tsconfigs (node/worker/app).
      - run: pnpm typecheck

      # Every pure golden test (no network, no secrets — safe on fork PRs).
      # These were not all wired up here; test:roundtrip was running alone while
      # five more existed, and the content-index regression that motivated
      # test:index would have been caught by none of them. Listed individually
      # rather than via `pnpm test` so a failure names itself in the job log.
      # ADDING A TEST: add it here AND to the `test` script in package.json, or it
      # runs in exactly one of the two places and nobody notices which. Either job
      # counts; `pnpm test:wiring` reads the whole file.
      - run: pnpm test:roundtrip
      - run: pnpm test:views
      - run: pnpm test:import
      - run: pnpm test:tools
      - run: pnpm test:patch
      - run: pnpm test:structure
      - run: pnpm test:consolidate
      - run: pnpm test:probe
      - run: pnpm test:index
      - run: pnpm test:links
      - run: pnpm test:policy
      - run: pnpm test:preamble
      - run: pnpm test:dedupe
      - run: pnpm test:appmeta
      - run: pnpm test:loading
      - run: pnpm test:access
      - run: pnpm test:scope
      - run: pnpm test:feedback
      - run: pnpm test:usage
      - run: pnpm test:media
      # The assertions the deploy runs against a live origin before it decides whether
      # to keep a merge in production. Offline here: driven against stub responses.
      - run: pnpm test:smoke
      # Lints the two lists above against package.json, so the instruction in the
      # comment stops depending on anyone reading the comment. It also pins the
      # Playwright container tag in the `ui` job to the resolved dependency version.
      - run: pnpm test:wiring
      # The write-path end-to-end batteries. They used to need real GitHub App
      # credentials and so could not gate a pull request; they now run against the
      # fs + git BrainStore in a temp directory, offline and secret-free, which keeps
      # this workflow fork-safe. `--github` still runs the identical assertions
      # against a real scratch repo, by hand, to cover the GitHub adapter itself.
      - run: pnpm test:e2e-librarian
      - run: pnpm test:e2e-import

      # Formatting is checked, not applied — a PR that reformats unrelated files is
      # noise, and `--check` tells the contributor exactly what to run.
      - name: Prettier formatting
        run: pnpm exec prettier --check .

      # Validate the D1 migrations apply cleanly against a fresh LOCAL database
      # (offline — no Cloudflare token, never touches prod). Catches malformed
      # migration SQL on the PR, before it can reach the deploy's --remote apply.
      - name: D1 migrations apply cleanly (local)
        run: pnpm exec wrangler d1 migrations apply platform-db --local

      # Known advisories against the dependencies the Worker actually serves.
      # `--prod` is doing real work: it drops the wrangler/miniflare subtree, which
      # is most of the raw count and none of the production exposure.
      #
      # REPORTS, DOES NOT GATE. The tree currently has advisories this repo has not
      # cleared, so a blocking step would red every pull request until they are, which
      # trains people to ignore it. Dependabot is the mechanism that actually chases
      # these; this step exists so a PR that ADDS a vulnerable dependency says so in
      # the log. Drop `continue-on-error` once `pnpm security:audit` is clean.
      #
      # Not named `test:*` on purpose: the batteries above are offline, and this one
      # calls the registry. It needs no secret, so it stays fork-safe.
      - name: Dependency advisories (production tree)
        run: pnpm security:audit
        continue-on-error: true

  ui:
    # The UI tests drive the REAL generated app bundle in a real browser, over the
    # local host harness (dev/harness.ts) with its fixtures. Offline and secret-free
    # like everything else here: the only extra requirement is the browser.
    runs-on: ubuntu-latest
    # PLAYWRIGHT'S OWN IMAGE, so `apt-get` never runs here. The browser binary was
    # cacheable and the system libraries it needs were not, because the runner is fresh
    # every time — so `playwright install-deps` shelled out to Ubuntu's mirrors on
    # every run and was the slowest and only genuinely flaky step in this workflow:
    # 15s against a healthy mirror, 124s and 395s against degraded ones, and one
    # 12-minute stall that failed the run outright (issue #44). The image bakes in both
    # halves, which trades a variable apt for a deterministic pull and removes the
    # failure class instead of retrying through it. It also sets
    # PLAYWRIGHT_BROWSERS_PATH=/ms-playwright, so nothing here installs or caches a
    # browser at all — the download step and the version-keyed cache that used to guard
    # it are both gone.
    #
    # BUMP THIS TAG WITH THE @playwright/test DEPENDENCY. The image ships exactly the
    # browser build its own version expects, so a mismatch means the browser our
    # installed Playwright looks for is not in the image. `pnpm test:wiring` compares
    # this tag against the version pnpm resolves and fails if they drift, so the bump
    # cannot be forgotten and the failure names itself rather than arriving as a
    # confusing missing-browser in CI.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    # Roughly four minutes when healthy, most of it the image pull and the app bundle
    # build. Same backstop reasoning as the job above.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      # The image ships a Node of its own; pin ours to the version in `engines` so the
      # UI job runs the same runtime as every other job.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # UI_STRICT=1 turns `pnpm test:ui`'s skip-green browser guard into a failure —
      # locally a missing browser should not fail a contributor's `pnpm test`, but here
      # it means the container stopped carrying one and the UI tests silently did not
      # run, which is exactly the failure a green skip would hide.
      - run: pnpm test:ui
        env:
          UI_STRICT: '1'

      # playwright.config.ts sets `trace: 'retain-on-failure'` and
      # `screenshot: 'only-on-failure'`, and nothing collected them, so the runner was
      # destroyed with the evidence on it: a UI failure in CI reported THAT it failed
      # and nothing about why. Only on failure, so a green run uploads nothing.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
