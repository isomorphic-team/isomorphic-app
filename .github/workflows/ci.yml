name: CI

# Validate every PR the same way the deploy validates main: regenerate the codegen'd
# artifacts, verify the committed bundle is in sync with source, typecheck all three
# tsconfigs, and run the golden tests. This runs `on: pull_request`, so the results
# appear as CHECKS on the PR — previously the only workflow was deploy.yml (push to
# main), which runs after merge and so can't gate a PR.
#
# FORK-SAFE BY DESIGN: every step here is offline and needs NO secrets, so a pull
# request from a contributor's fork gets the same green-or-red signal a maintainer's
# branch does. Do not add a step that requires a token — put it in deploy.yml instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A successful run takes 3 to 5 minutes. Without this, a step that hangs runs until
    # GitHub's 6-hour default: on 2026-08-18 the apt half of the Playwright install stalled
    # on an unresponsive Ubuntu mirror and sat there for 32 minutes before a human noticed,
    # holding a runner and showing the pull request a check that was neither passing nor
    # failing. Generous enough that a slow-but-working run is never killed: the dependency
    # step alone can spend 15 minutes across its three attempts before giving up.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler.jsonc is generated and gitignored (it holds one deployment's
      # identity). The default profile writes placeholder Cloudflare resource ids,
      # which is exactly right here: the migration check below runs against
      # Miniflare and never contacts Cloudflare, so CI needs no credentials.
      - run: pnpm setup:config

      # Regenerate the codegen'd artifacts from source (app/ and brain-template/).
      - run: pnpm gen:templates
      - run: pnpm gen:app

      # The committed generated files must match a fresh regen — catches a PR that
      # edited app/ or brain-template/ but forgot to run `pnpm gen:app` / `gen:templates`.
      - name: Generated artifacts in sync with source
        run: |
          git diff --exit-code -- \
            src/lib/app-bundle.generated.ts \
            src/lib/brain-template.generated.ts \
          || { echo "::error::Generated files are stale — run 'pnpm gen:app' and 'pnpm gen:templates' and commit the result."; exit 1; }

      # Gate on a clean typecheck across all three tsconfigs (node/worker/app).
      - run: pnpm typecheck

      # Every pure golden test (no network, no secrets — safe on fork PRs).
      # These were not all wired up here; test:roundtrip was running alone while
      # five more existed, and the content-index regression that motivated
      # test:index would have been caught by none of them. Listed individually
      # rather than via `pnpm test` so a failure names itself in the job log.
      # ADDING A TEST: add it here AND to the `test` script in package.json, or it
      # runs in exactly one of the two places and nobody notices which.
      - run: pnpm test:roundtrip
      - run: pnpm test:views
      - run: pnpm test:import
      - run: pnpm test:tools
      - run: pnpm test:patch
      - run: pnpm test:structure
      - run: pnpm test:index
      - run: pnpm test:search
      - run: pnpm test:links
      - run: pnpm test:policy
      - run: pnpm test:access
      - run: pnpm test:scope
      - run: pnpm test:feedback
      - run: pnpm test:usage
      - run: pnpm test:media
      # The assertions the deploy runs against a live origin before it decides whether
      # to keep a merge in production. Offline here: driven against stub responses.
      - run: pnpm test:smoke
      # Lints the two lists above against package.json, so the instruction in the
      # comment stops depending on anyone reading the comment.
      - run: pnpm test:wiring
      # The write-path end-to-end batteries. They used to need real GitHub App
      # credentials and so could not gate a pull request; they now run against the
      # fs + git BrainStore in a temp directory, offline and secret-free, which keeps
      # this workflow fork-safe. `--github` still runs the identical assertions
      # against a real scratch repo, by hand, to cover the GitHub adapter itself.
      - run: pnpm test:e2e-librarian
      - run: pnpm test:e2e-import

      # The UI tests drive the REAL generated app bundle in a real browser, over the
      # local host harness (dev/harness.ts) with its fixtures. Offline and secret-free
      # like everything else here: the only extra requirement is the browser binary.
      #
      # Chromium only, and `--with-deps` for the system libraries the runner lacks.
      # UI_STRICT=1 turns `pnpm test:ui`'s skip-green browser guard into a failure —
      # locally a missing browser should not fail a contributor's `pnpm test`, but in
      # CI it means the install step above it broke and the UI tests silently did not
      # run, which is exactly the failure a green skip would hide.
      # Chromium was re-downloaded on every run. The cache is keyed on the RESOLVED
      # Playwright version rather than on the lockfile hash, so an unrelated dependency
      # bump does not evict a browser that is still the right one, and a Playwright
      # bump does not restore one that is now wrong.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # SPLIT ON PURPOSE. `playwright install --with-deps` does two unrelated things:
      # apt-get as root against Ubuntu's mirrors, and a browser download from Playwright's
      # CDN. Only the first is flaky, and coupling them meant a mirror outage looked like
      # "Chromium won't install". It also defeats the cache above, which skips the download
      # but can do nothing about apt.
      #
      # `timeout` bounds each ATTEMPT rather than the step, so a stalled mirror is cut loose
      # and retried instead of eating the whole budget. apt itself has no timeout: on
      # 2026-08-18 it sat on an unresponsive noble-security for 32 minutes without a word.
      # The step timeout below is a second backstop in case the retry loop misbehaves.
      #
      # PER-ATTEMPT CAP: the point is to cut a HANG without cutting a slow success, and the
      # gap between those is narrower than it looks. Three measurements from 2026-08-18:
      # a healthy run took 51s; a run against a degraded mirror took 148s, fetching 21 MB at
      # 154 kB/s; and the hang ran past 32 minutes with no output at all. The first version
      # of this loop used 180s, which is 32 seconds of headroom over an install that WORKED,
      # so a slightly worse mirror would have had it killing a healthy run and retrying into
      # the same slow mirror three times. 300s is twice the worst observed success. Raise it
      # if a run is ever killed here while apt was still making progress; the log shows the
      # transfer rate.
      - name: Install Chromium system dependencies
        timeout-minutes: 16
        run: |
          for attempt in 1 2 3; do
            if timeout 300 pnpm exec playwright install-deps chromium; then exit 0; fi
            echo "::warning::playwright install-deps failed or stalled (attempt ${attempt}/3). Ubuntu mirrors are the usual cause. Retrying."
            sleep 15
          done
          echo "::error::Could not install the Chromium system dependencies after 3 attempts."
          exit 1

      # The cached half. On a cache hit this is close to a no-op.
      - name: Install Chromium
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
      - run: pnpm test:ui
        env:
          UI_STRICT: '1'

      # playwright.config.ts sets `trace: 'retain-on-failure'` and
      # `screenshot: 'only-on-failure'`, and nothing collected them, so the runner was
      # destroyed with the evidence on it: a UI failure in CI reported THAT it failed
      # and nothing about why. Only on failure, so a green run uploads nothing.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Formatting is checked, not applied — a PR that reformats unrelated files is
      # noise, and `--check` tells the contributor exactly what to run.
      - name: Prettier formatting
        run: pnpm exec prettier --check .

      # Validate the D1 migrations apply cleanly against a fresh LOCAL database
      # (offline — no Cloudflare token, never touches prod). Catches malformed
      # migration SQL on the PR, before it can reach the deploy's --remote apply.
      - name: D1 migrations apply cleanly (local)
        run: pnpm exec wrangler d1 migrations apply platform-db --local
