name: CLA

# Asks a first-time contributor to sign CLA.md by replying to a bot comment, and records
# the signature in this repo on the `cla-signatures` branch. Once signed, a contributor is
# never asked again.
#
# Setup (one time, before the repo goes public):
#   1. Create a fine-grained PAT with `contents: write` on THIS repo only. A PAT is needed
#      rather than GITHUB_TOKEN because the signature file is committed from a workflow
#      triggered by a fork's pull request.
#   2. gh secret set CLA_SIGNATURES_TOKEN --repo isomorphic-team/isomorphic-app
#   3. git switch --orphan cla-signatures && git commit --allow-empty -m "init" && git push
#      (the action creates the file itself; the branch just has to exist)
#
# Until the secret is set this workflow no-ops with a warning instead of failing every PR,
# so a missing token can never block a contribution.
#
# `pull_request_target` is required: a fork's default GITHUB_TOKEN is read-only, so the
# comment and the commit have to run in the base repo's context. This workflow deliberately
# does NOT check out or execute any code from the pull request, which is what makes
# pull_request_target safe here. Do not add a checkout of `github.event.pull_request.head`.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only run on the signature phrase, or on PR events. Skips unrelated issue comments.
    if: >-
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - name: Check for signature-store token
        id: guard
        env:
          TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLA_SIGNATURES_TOKEN is not set — skipping the CLA check. See the setup notes at the top of .github/workflows/cla.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: CLA assistant
        if: steps.guard.outputs.ready == 'true'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/isomorphic-team/isomorphic-app/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot],github-actions[bot]
          # Docs-only and typo fixes are merged without a signature (see CONTRIBUTING.md);
          # a maintainer applies this label to release such a PR from the check.
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before we can merge it, please read our
            [Contributor License Agreement](https://github.com/isomorphic-team/isomorphic-app/blob/main/CLA.md)
            and sign it by posting the exact comment below in this thread.


            You keep the copyright in your work. The CLA lets us include your contribution in
            releases we also sell commercial licenses to, and it commits us to keeping your
            contribution under an OSI-approved open source license, permanently.
            The reasoning is in
            [docs/licensing.md](https://github.com/isomorphic-team/isomorphic-app/blob/main/docs/licensing.md#the-cla-and-what-commercialize-later-means).


            You only ever do this once.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed. Thanks, and welcome.'
