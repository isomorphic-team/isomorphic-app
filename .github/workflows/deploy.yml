name: Deploy Worker

# Auto-deploy the MCP Worker to Cloudflare on every push to main. The Worker's
# runtime secrets (GitHub App creds, Auth.js/Resend keys, MCP_BEARER_TOKEN, ...) are
# NOT touched by this job: they were set once via `wrangler secret put` and persist
# across versions. CI only needs a CLOUDFLARE_API_TOKEN to authenticate.
#
# Setup (one time):
#   1. Create a USER API token: Cloudflare dashboard → My Profile → API Tokens →
#      Create Token → "Edit Cloudflare Workers" template, then ADD one row:
#      Account → D1 → Edit. Scope it to the account that owns this Worker.
#
#      D1 Edit is NOT in the Workers template and you must add it. The migration
#      step below runs BEFORE the deploy step, so a token without it fails there
#      and main silently stops shipping, with the reason buried in a job log.
#
#      Use a USER token, not an account-owned one. Account-owned tokens have no
#      User scope, so they cannot carry `User → Memberships → Read`, which
#      wrangler calls /memberships to resolve the target account. That fails with
#      "Unable to authenticate request [code: 10001]"
#      (cloudflare/workers-sdk#9129, filed against 4.14.1 and closed without a
#      confirmed fix). Account-owned tokens are the better shape in principle
#      because they outlive a person; retest before switching, and note that they
#      do NOT solve account ownership if the Cloudflare account itself is personal.
#
#   2. gh secret set CLOUDFLARE_API_TOKEN --env production
#      Environment scope, not repository scope: that is what keeps the token
#      unreachable from any workflow other than this job.
#   3. Only if the token can reach more than one account:
#      gh secret set CLOUDFLARE_ACCOUNT_ID --env production
#   4. Record this deployment's identity as repository VARIABLES (not secrets — none
#      of these are secret, and keeping them visible makes a misconfigured deploy
#      diagnosable). `pnpm setup:config --print-ci` prints the exact commands from
#      your local .dev.vars:
#        gh variable set WORKER_NAME OBJECTS_WORKER_NAME CF_OAUTH_KV_ID CF_OAUTH_KV_PREVIEW_ID \
#                        CF_D1_DATABASE_ID D1_DATABASE_NAME PUBLIC_BASE_URL \
#                        AUTH_MODE AUTO_PROVISION AUTH_EMAIL_FROM AUTH_EMAIL_REPLY_TO \
#                        APP_SLUG USAGE_ANALYTICS
#
# Step 4 exists because wrangler.jsonc is generated and gitignored — it holds one
# deployment's identity (Worker name, public URL, Cloudflare resource ids) and so is
# not committed. This job regenerates it from the variables above before deploying.
# Without them the job skips with a warning rather than deploying a Worker named
# after the template defaults.
#
# HOW A MERGE REACHES PRODUCTION
# ------------------------------
# Not `wrangler deploy`, which uploads and serves in one step and leaves nothing to
# fall back to. This job uploads a VERSION, checks it, and only then points traffic
# at it, so that a bad merge can be undone by the pipeline that shipped it:
#
#   1. apply D1 migrations (schema-first)
#   2. deploy the objects Worker, which implements the Durable Objects this Worker binds,
#      after recording its live version
#   3. record the currently-live version id, which is the rollback target
#   4. `versions upload` -> new version, serving no traffic
#   5. smoke check its preview URL, when Cloudflare issued one, and stop here if it
#      fails; nothing has taken traffic yet, so there is nothing to undo
#   6. `versions deploy <id>@100%` to promote
#   7. smoke check the production origin
#   8. on failure: `wrangler rollback <recorded id>` for both Workers, re-check, and fail
#      the run red. The objects Worker stays where it is when the deploy added a Durable
#      Object class, which Cloudflare will not roll back across
#
# The checks are in scripts/smoke.ts and are covered by `pnpm test:smoke`. They are
# deliberately testable rather than inline shell: this is the logic that decides
# whether a merge stays in production, and it fails expensively in both directions
# (too strict reverts healthy deploys, too loose never fires).
#
# WHAT THE ROLLBACK DOES NOT COVER, stated plainly:
#   - Applied D1 migrations. Code reverts; schema does not. See the migration step.
#   - A wrong PUBLIC_BASE_URL. @cloudflare/workers-oauth-provider builds its metadata
#     from the request origin, not from the configured base URL, so every assertion
#     passes on any hostname. Nothing here catches that.
#   - Anything an unauthenticated read cannot see. A full authenticated `initialize`
#     plus `tools/list` needs a magic-link round trip and is not scripted.
#
# THE `production` ENVIRONMENT
# --------------------------
# The job runs in the `production` environment, which does two things:
#
#   1. Secret scoping - CLOUDFLARE_API_TOKEN lives in this environment rather than at
#      repository level, so no other workflow can reach it, including one added by a
#      pull request. Environment secrets take precedence over repository secrets.
#   2. Deployment branch policy - deployments are restricted to protected branches,
#      so a `workflow_dispatch` from a random branch cannot ship.
#
# There is no required-reviewer rule: merging `main` ships. Review happens before the
# merge (CODEOWNERS on `*` with code-owner reviews required, and required checks no
# one can bypass), and the rollout below undoes a version that fails to boot or fails
# its OAuth surface. It does NOT catch a merge that is simply wrong; review is for
# that. Protection settings, and how to add a reviewer gate back:
# docs/ops/repo-protection.md

on:
  push:
    branches: [main]
    # Docs-only changes don't affect the Worker or the app bundle.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read
  # Lets the run show up under the repo's Deployments, so there is a history of
  # what shipped.
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `concurrency: deploy-worker` has cancel-in-progress false, so a job that hangs holds
    # the group and every later merge queues behind it. Bounded well above a normal run,
    # which is a few minutes of work.
    timeout-minutes: 30
    # Secret scoping and the branch policy; see the note at the top of this file.
    # `url` makes the deployed origin a clickable link on the run and in the
    # Deployments tab; it reads the same variable the Worker is configured with, so
    # the two cannot drift.
    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regenerate the codegen'd artifacts so the deployed bundle always matches
      # source, even if a commit forgot to run `pnpm gen:app` / `pnpm gen:templates`.
      - run: pnpm gen:templates
      - run: pnpm gen:app

      # Gate the deploy on a clean typecheck across all four tsconfigs.
      - run: pnpm typecheck

      # Skip (green) rather than fail if this repo hasn't been wired up yet. Both the
      # Cloudflare token and the deployment-identity variables are required; deploying
      # with the template defaults would publish a Worker named "isomorphic-mcp"
      # pointing at resource ids that don't exist.
      - name: Check deploy configuration
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_OAUTH_KV_ID: ${{ vars.CF_OAUTH_KV_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: |
          ready=true
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, skipping deploy. Add it as a secret of the production environment (Settings → Environments → production)."
            ready=false
          fi
          if [ -z "$CF_OAUTH_KV_ID" ] || [ -z "$CF_D1_DATABASE_ID" ]; then
            echo "::warning::CF_OAUTH_KV_ID / CF_D1_DATABASE_ID are not set as repository variables — skipping deploy. Run 'pnpm setup:config --print-ci' locally for the exact commands, or see the setup notes at the top of this workflow."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      # wrangler.jsonc and wrangler.objects.jsonc are generated, not committed. Build them
      # from this repo's variables so the deployed Workers carry this deployment's identity.
      # Unset variables fall back to the template defaults in scripts/setup-config.ts,
      # which is why the guard above insists on the two resource ids.
      - name: Generate the Wrangler configs for this deployment
        if: steps.guard.outputs.ready == 'true'
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          AUTH_EMAIL_REPLY_TO: ${{ vars.AUTH_EMAIL_REPLY_TO }}
          AUTO_PROVISION: ${{ vars.AUTO_PROVISION }}
          USAGE_ANALYTICS: ${{ vars.USAGE_ANALYTICS }}
          # GitHub rejects repository variables named GITHUB_*, so the CI-facing
          # name is APP_SLUG. setup-config maps it back. See scripts/setup-config.ts.
          APP_SLUG: ${{ vars.APP_SLUG }}
          OBJECTS_WORKER_NAME: ${{ vars.OBJECTS_WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          INDEX_D1_DATABASE_NAME: ${{ vars.INDEX_D1_DATABASE_NAME }}
          CF_INDEX_D1_DATABASE_ID: ${{ vars.CF_INDEX_D1_DATABASE_ID }}
          CF_OAUTH_KV_ID: ${{ vars.CF_OAUTH_KV_ID }}
          CF_OAUTH_KV_PREVIEW_ID: ${{ vars.CF_OAUTH_KV_PREVIEW_ID }}
        run: pnpm setup:config --force

      # Apply pending D1 migrations BEFORE deploying the code that depends on them
      # (schema-first). Idempotent: wrangler tracks applied migrations in the
      # d1_migrations table, so only new ones run. The token needs D1 edit permission.
      # If this step fails, everything below is skipped and main stays on the old code.
      #
      # ROLLBACK DOES NOT UNDO THIS. The automated rollback below reverts CODE, by
      # repointing traffic at the previous Worker version; applied migrations stay
      # applied. That is why migrations must be backward-compatible with the
      # still-running old code (additive; renames and drops go expand-then-contract).
      # That rule already existed for the deploy window. It is now what makes the
      # rollback safe, so it is load-bearing rather than tidy.
      - name: Apply D1 migrations (prod)
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec wrangler d1 migrations apply "${D1_DATABASE_NAME:-platform-db}" --remote
        env:
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The content index's own database, when this deployment has one
      # (CF_INDEX_D1_DATABASE_ID). Schema first, as above. Its rows are derived from
      # git, so a new database fills itself on each brain's next read.
      - name: Apply index database migrations (prod)
        if: steps.guard.outputs.ready == 'true' && vars.CF_INDEX_D1_DATABASE_ID != ''
        run: pnpm exec wrangler d1 migrations apply "${INDEX_D1_DATABASE_NAME:-index-db}" --remote
        env:
          INDEX_D1_DATABASE_NAME: ${{ vars.INDEX_D1_DATABASE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # THE ROLLBACK TARGETS, read before anything changes: each Worker's live version.
      #
      # `wrangler rollback` with no argument picks the previous deployment itself, but
      # an explicit id is what makes the rollback auditable: the job log names the
      # version it will return to, before it has any reason to. Recording it after a
      # failure would mean reading state we no longer trust.
      #
      # A first-ever deploy has no live version. That is not an error; it just means
      # there is nothing to roll back to, and the guards below turn a failure into a red
      # run without a rollback attempt.
      - name: Record the currently-live versions
        id: live
        if: steps.guard.outputs.ready == 'true'
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          live() {
            pnpm exec wrangler deployments status --json "$@" 2>/dev/null \
              | jq -r '[.versions[]? | select(.percentage == 100) | .version_id] | first // empty' 2>/dev/null || true
          }
          previous=$(live)
          objects=$(live -c wrangler.objects.jsonc)
          echo "Rollback targets: MCP Worker ${previous:-none}, objects Worker ${objects:-none}"
          if [ -z "$previous" ] || [ -z "$objects" ]; then
            echo "::warning::A Worker has no live version (first deploy?). A failure will fail the run without rolling that Worker back."
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "objects_previous=$objects" >> "$GITHUB_OUTPUT"

      # THE OBJECTS WORKER, BEFORE THE VERSION THAT BINDS IT. It implements the Durable
      # Objects this Worker binds by script_name (wrangler.objects.template.jsonc). It is
      # deployed with `wrangler deploy`, not uploaded and promoted, because Durable Object
      # migrations apply only through `wrangler deploy`; and it cannot be smoke checked
      # before it takes traffic, because a Worker implementing a Durable Object gets no
      # preview URL. The smoke checks below reach it through /health, which pings it.
      #
      # So the objects Worker's RPC methods and journal tables only ever grow: the MCP
      # Worker version live while this runs, and the one a rollback returns to, call it.
      - name: Deploy the objects Worker
        id: objects
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy -c wrangler.objects.jsonc \
            --message "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"

      # UPLOAD, DO NOT DEPLOY. `versions upload` publishes the code as a new version
      # that serves NO traffic. Secrets set with `wrangler secret put` carry over: they
      # are only replaced when `--secrets-file` is passed, which nothing here does.
      #
      # WRANGLER_OUTPUT_FILE_DIRECTORY makes wrangler write a machine-readable ndjson
      # record of what it did, so the version id and preview URL are read from a
      # documented field rather than scraped out of human-facing stdout.
      - name: Upload the new version
        id: upload
        if: steps.guard.outputs.ready == 'true'
        env:
          WRANGLER_OUTPUT_FILE_DIRECTORY: ${{ runner.temp }}/wrangler-output
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$WRANGLER_OUTPUT_FILE_DIRECTORY"

          pnpm exec wrangler versions upload \
            --tag "${GITHUB_SHA::7}" \
            --message "$(git log -1 --pretty=%s | cut -c1-100)"

          # wrangler writes one or more ndjson files here. `jq -s` slurps them into an
          # array; the last version-upload entry is this run's.
          files=$(find "$WRANGLER_OUTPUT_FILE_DIRECTORY" -type f -name '*.json')
          if [ -z "$files" ]; then
            echo "::error::wrangler wrote no output file, so the new version cannot be identified. Refusing to promote."
            exit 1
          fi
          entry=$(cat $files | jq -s '[.[] | select(.type == "version-upload")] | last')
          version=$(printf '%s' "$entry" | jq -r '.version_id // empty')
          preview=$(printf '%s' "$entry" | jq -r '.preview_url // empty')

          if [ -z "$version" ]; then
            echo "::error::wrangler reported no version id; refusing to promote something unidentified."
            exit 1
          fi
          echo "Uploaded version $version"
          [ -n "$preview" ] && echo "Preview URL: $preview" || true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"

      # SMOKE THE VERSION BEFORE IT TAKES TRAFFIC, when Cloudflare gave us a URL for it.
      #
      # This is the good path: a version that cannot boot never serves a single user
      # request, and no rollback is needed because no rollout happened. Cloudflare
      # decides whether a version gets a preview URL and reports it as
      # `metadata.has_preview` on the upload, so this branches on the answer rather
      # than assuming one. This Worker DOES get them: preview URLs are withheld from
      # Workers implementing a Durable Object, and the append-only `migrations` array
      # naming the deleted IsomorphicMindMcp class turns out not to count, since every
      # version since number 77 reports has_preview true (checked 2026-08-18, see
      # docs/ops/deploy-and-rollback.md). Binding a class the objects Worker implements
      # keeps them (checked 2026-11-09). The branch stays because implementing a class
      # here would silently take them away, and a pipeline that quietly stopped checking
      # before promoting is worse than one that says so.
      #
      # A preview URL of the PRODUCTION Worker shares production's bindings. That is
      # wrong for a feature preview and exactly right here: it is prod, one promotion
      # early. Every assertion in scripts/smoke.ts is an unauthenticated read.
      - name: Smoke check the version before promoting it
        id: presmoke
        if: steps.guard.outputs.ready == 'true' && steps.upload.outputs.preview != ''
        run: pnpm exec tsx scripts/smoke.ts "${{ steps.upload.outputs.preview }}"

      - name: Note that pre-promotion smoke was unavailable
        if: steps.guard.outputs.ready == 'true' && steps.upload.outputs.preview == ''
        run: |
          echo "::warning::Cloudflare returned no preview URL for this version, so it could not be smoke checked before promotion. Falling back to promote, smoke, and roll back on failure."

      # PROMOTE. Only reached if the pre-promotion smoke passed, or if there was no
      # preview URL to run it against.
      - name: Promote the version to 100% of traffic
        id: promote
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler versions deploy "${{ steps.upload.outputs.version }}@100%" \
            --message "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --yes

      # THE SAFETY VALVE. Smoke the real origin after the rollout.
      #
      # `continue-on-error` so a failure does not end the job here: the rollback below
      # has to run, and then the run has to go red. A failed smoke check that merely
      # stopped the job would leave the bad version serving traffic.
      - name: Smoke check production
        id: smoke
        if: steps.guard.outputs.ready == 'true' && steps.promote.outcome == 'success'
        continue-on-error: true
        run: pnpm exec tsx scripts/smoke.ts "${{ vars.PUBLIC_BASE_URL }}"

      - name: Roll back
        id: rollback
        if: steps.smoke.outcome == 'failure' && steps.live.outputs.previous != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::error::Production smoke check failed. Rolling back to ${{ steps.live.outputs.previous }}."
          pnpm exec wrangler rollback "${{ steps.live.outputs.previous }}" \
            --message "Automated rollback: smoke check failed for ${GITHUB_SHA::7}" \
            --yes

      # Any failure after the objects Worker deployed returns it to its recorded version too,
      # so production goes back to the pair that last passed. Before the verify step below,
      # which checks that pair.
      #
      # Cloudflare refuses a rollback across a Durable Object class change (a new entry in
      # `migrations`), so a deploy that added a class leaves the new objects Worker in
      # place. That pair is supported: the objects Worker's RPC methods and tables only
      # grow. `continue-on-error` keeps a refused rollback from skipping the verify step,
      # which smoke checks whichever pair is live. The run is red by this point either way.
      - name: Roll back the objects Worker
        id: objects_rollback
        if: ${{ !cancelled() && steps.objects.outcome == 'success' && steps.live.outputs.objects_previous != '' && (failure() || steps.smoke.outcome == 'failure') }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::error::Rolling the objects Worker back to ${{ steps.live.outputs.objects_previous }}."
          if ! pnpm exec wrangler rollback "${{ steps.live.outputs.objects_previous }}" -c wrangler.objects.jsonc \
            --message "Automated rollback: deploy of ${GITHUB_SHA::7} failed" \
            --yes; then
            echo "::error::The objects Worker was NOT rolled back and is still on ${GITHUB_SHA::7}. Cloudflare refuses a rollback across a Durable Object class change; if this deploy added one, that is why, and the previous MCP Worker runs against the new objects Worker."
            exit 1
          fi

      # Rolling back and then not checking would be a guess, and the failure mode it
      # hides is the worst one available: production down, pipeline reporting that it
      # handled things. If this fails, the run says so in the loudest terms it has.
      - name: Verify the rollback restored a working origin
        if: steps.rollback.outcome == 'success'
        run: |
          if pnpm exec tsx scripts/smoke.ts "${{ vars.PUBLIC_BASE_URL }}"; then
            echo "::error::Rolled back to ${{ steps.live.outputs.previous }} and production is healthy again. The merged commit did NOT ship."
          else
            echo "::error::ROLLBACK DID NOT RESTORE A HEALTHY ORIGIN. Production is still failing its smoke check and needs a human now."
            exit 1
          fi

      # Turn the run red. Everything above this point was arranged so the rollback
      # could happen first; the job must still fail, or a rolled-back deploy shows up
      # as a green checkmark on main and nobody looks at it.
      - name: Fail the run if the deploy did not stick
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Deploy of ${GITHUB_SHA::7} failed its smoke check and was rolled back. main is running the previous version."
          exit 1
